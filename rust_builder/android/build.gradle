// The Android Gradle Plugin builds the Rust library with the Android NDK.
// This project intentionally relies on the host app's AGP 9 plugin instead of
// bundling an obsolete AGP/Kotlin classpath of its own.

plugins {
    id 'com.android.library'
}

group 'com.flutter_rust_bridge.chess_api'
version '1.0'

android {
    namespace 'com.flutter_rust_bridge.chess_api'
    compileSdk 36

    // The host app pins the NDK used by Cargokit.
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust/chess_api"
    libname = "chess_api"
}
