name: Quality

on:
  pull_request:
  push:
    branches: ['**']

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --release --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --release --workspace

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Check Cargokit build tool separately
        working-directory: rust_builder/cargokit/build_tool
        run: |
          dart pub get --enforce-lockfile
          dart analyze
