# Keep Android builds viable on ordinary 8-16 GB developer/CI machines while
# leaving enough headroom for Flutter, Rust/Cargokit, and the Android toolchain.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Cargokit is an FFI-only Android plugin whose current variant hook still uses
# Flutter's documented AGP 9 legacy-Kotlin compatibility layer. Keep this
# explicit until Cargokit publishes a built-in-Kotlin migration.
android.builtInKotlin=false
